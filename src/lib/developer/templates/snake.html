<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Snake // Vector Run</title>
<style>
  :root { --cyan: #3ff5d0; --violet: #9b7bff; --pink: #ff5ea8; --ink: #ecfff9; --muted: #799b92; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 14px;
    background:
      radial-gradient(circle at 20% 10%, rgba(63, 245, 208, 0.13), transparent 32rem),
      radial-gradient(circle at 85% 90%, rgba(155, 123, 255, 0.15), transparent 30rem),
      #030806;
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .shell { width: min(100%, 480px); }
  .topline {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 4px 10px; font-family: 'Cascadia Code', Consolas, monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
  }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--cyan); }
  .brand i {
    width: 7px; height: 7px; border-radius: 2px; background: var(--cyan);
    box-shadow: 0 0 14px var(--cyan); animation: pulse 2.2s ease-in-out infinite;
  }
  .sound {
    appearance: none; border: 1px solid rgba(255, 255, 255, 0.09); background: rgba(255, 255, 255, 0.02);
    color: var(--muted); border-radius: 999px; padding: 7px 12px; font: inherit;
    letter-spacing: 0.14em; cursor: pointer; transition: 160ms ease;
  }
  .sound:hover, .sound:focus-visible { color: var(--cyan); border-color: rgba(63, 245, 208, 0.35); outline: none; }
  .frame {
    position: relative; border-radius: 22px; padding: 1px;
    background: linear-gradient(145deg, rgba(63, 245, 208, 0.5), rgba(155, 123, 255, 0.12) 44%, rgba(255, 94, 168, 0.3));
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), 0 0 70px rgba(63, 245, 208, 0.07);
  }
  .frame::after {
    content: ''; position: absolute; inset: -18px; border-radius: 34px; z-index: -1;
    background: radial-gradient(closest-side, rgba(63, 245, 208, 0.11), transparent); pointer-events: none;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: 21px; background: #04120e; touch-action: none; cursor: pointer; }
  .hint {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 6px 0; font-family: 'Cascadia Code', Consolas, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #5f837a;
  }
  .hint strong { color: #a8d6ca; font-weight: 500; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .brand i { animation: none; } }
</style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <span class="brand"><i></i> snake // vector run</span>
      <button class="sound" id="sound" type="button" aria-label="Toggle sound">sound on</button>
    </div>
    <div class="frame">
      <canvas id="game" width="480" height="520" aria-label="Snake game. Use arrow keys or WASD, or swipe on the board."></canvas>
    </div>
    <div class="hint">
      <span><strong>arrows</strong> / <strong>wasd</strong> / swipe</span>
      <span><strong>p</strong> pause · <strong>m</strong> mute</span>
    </div>
  </main>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const soundButton = document.getElementById('sound');
  const W = 480;
  const H = 520;
  const HUD = 40;
  const COLS = 24;
  const ROWS = 24;
  const CELL = 20;
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const keyOf = (point) => point.x + ',' + point.y;

  let best = 0;
  try { best = Number(localStorage.getItem('friday-snake-best')) || 0; } catch (_) { best = 0; }
  let muted = false;
  let audio = null;

  function beep(frequency, duration, type, volume) {
    if (muted) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(frequency, audio.currentTime);
      gain.gain.setValueAtTime(volume || 0.02, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
      osc.connect(gain).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + duration);
    } catch (_) { /* audio is optional */ }
  }

  soundButton.addEventListener('click', () => {
    muted = !muted;
    soundButton.textContent = muted ? 'sound off' : 'sound on';
  });

  const game = {
    mode: 'ready',
    snake: [],
    direction: { x: 1, y: 0 },
    queued: [],
    food: { x: 17, y: 12 },
    score: 0,
    tick: 0,
    interval: 0.135,
    elapsed: 0,
    shake: 0,
    particles: [],
    flash: 0
  };

  function reset() {
    const mid = Math.floor(ROWS / 2);
    game.snake = [
      { x: 7, y: mid },
      { x: 6, y: mid },
      { x: 5, y: mid },
      { x: 4, y: mid }
    ];
    game.direction = { x: 1, y: 0 };
    game.queued = [];
    game.score = 0;
    game.tick = 0;
    game.elapsed = 0;
    game.interval = 0.135;
    game.shake = 0;
    game.flash = 0;
    game.particles = [];
    game.mode = 'ready';
    placeFood();
  }

  function occupied(point) {
    return game.snake.some((segment) => segment.x === point.x && segment.y === point.y);
  }

  function placeFood() {
    let candidate = { x: randomInt(1, COLS - 2), y: randomInt(1, ROWS - 2) };
    let guard = 0;
    while (occupied(candidate) && guard < 800) {
      candidate = { x: randomInt(1, COLS - 2), y: randomInt(1, ROWS - 2) };
      guard += 1;
    }
    game.food = candidate;
  }

  function burst(cell, color, count) {
    const x = cell.x * CELL + CELL / 2;
    const y = HUD + cell.y * CELL + CELL / 2;
    for (let index = 0; index < (count || 14); index += 1) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 30 + Math.random() * 150;
      game.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.3 + Math.random() * 0.55,
        max: 0.85,
        size: 1.5 + Math.random() * 3.5,
        color
      });
    }
  }

  function turn(x, y) {
    if (game.mode === 'ready') {
      game.mode = 'playing';
      beep(240, 0.08, 'square', 0.02);
    }
    if (game.mode !== 'playing') return;
    const last = game.queued.length > 0 ? game.queued[game.queued.length - 1] : game.direction;
    if (last.x === -x && last.y === -y) return;
    if (last.x === x && last.y === y) return;
    if (game.queued.length < 2) game.queued.push({ x, y });
  }

  function die() {
    game.mode = 'dead';
    game.shake = 1;
    game.flash = 0.55;
    burst(game.snake[0], '#ff5ea8', 30);
    beep(120, 0.3, 'sawtooth', 0.05);
    if (game.score > best) {
      best = game.score;
      try { localStorage.setItem('friday-snake-best', String(best)); } catch (_) { /* private mode */ }
    }
  }

  function step() {
    if (game.queued.length > 0) game.direction = game.queued.shift();
    const head = game.snake[0];
    const next = { x: head.x + game.direction.x, y: head.y + game.direction.y };
    if (next.x < 0 || next.y < 0 || next.x >= COLS || next.y >= ROWS) {
      die();
      return;
    }
    if (game.snake.some((segment, index) => index < game.snake.length - 1 && segment.x === next.x && segment.y === next.y)) {
      die();
      return;
    }

    game.snake.unshift(next);
    if (next.x === game.food.x && next.y === game.food.y) {
      game.score += 1;
      game.flash = 0.3;
      game.shake = Math.min(0.6, game.shake + 0.2);
      burst(game.food, game.score % 2 === 0 ? '#3ff5d0' : '#9b7bff', 20);
      placeFood();
      game.interval = Math.max(0.055, 0.135 - game.score * 0.0035);
      beep(430 + Math.min(500, game.score * 22), 0.07, 'square', 0.022);
    } else {
      game.snake.pop();
    }
  }

  function update(dt) {
    game.elapsed += dt;
    game.shake = Math.max(0, game.shake - dt * 2.4);
    game.flash = Math.max(0, game.flash - dt * 2);

    for (const particle of game.particles) {
      particle.life -= dt;
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy += 120 * dt;
    }
    game.particles = game.particles.filter((particle) => particle.life > 0);

    if (game.mode !== 'playing') return;
    game.tick += dt;
    while (game.tick >= game.interval) {
      game.tick -= game.interval;
      step();
      if (game.mode !== 'playing') break;
    }
  }

  function drawBoard() {
    ctx.fillStyle = '#04120e';
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W * 0.3, HUD + 190, 10, W * 0.3, HUD + 190, 320);
    glow.addColorStop(0, 'rgba(63, 245, 208, 0.08)');
    glow.addColorStop(0.5, 'rgba(155, 123, 255, 0.04)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, HUD, W, H - HUD);

    ctx.strokeStyle = 'rgba(63, 245, 208, 0.045)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x += 1) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, HUD);
      ctx.lineTo(x * CELL, HUD + ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y += 1) {
      ctx.beginPath();
      ctx.moveTo(0, HUD + y * CELL);
      ctx.lineTo(W, HUD + y * CELL);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(63, 245, 208, 0.3)';
    ctx.strokeRect(0.5, HUD + 0.5, W - 1, ROWS * CELL - 1);
  }

  function drawHud() {
    ctx.fillStyle = '#061712';
    ctx.fillRect(0, 0, W, HUD);
    ctx.fillStyle = 'rgba(63, 245, 208, 0.18)';
    ctx.fillRect(0, HUD - 1, W, 1);

    ctx.font = '600 10px "Cascadia Code", Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(160, 220, 205, 0.55)';
    ctx.fillText('SCORE', 16, 16);
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ecfff9';
    ctx.fillText(String(game.score).padStart(2, '0'), 16, 33);

    ctx.textAlign = 'center';
    ctx.font = '600 10px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = 'rgba(160, 220, 205, 0.55)';
    ctx.fillText('LENGTH ' + game.snake.length, W / 2, 21);
    ctx.fillStyle = 'rgba(63, 245, 208, 0.75)';
    ctx.fillText('SPEED ' + (1 / game.interval).toFixed(1) + '×', W / 2, 34);

    ctx.textAlign = 'right';
    ctx.font = '600 10px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = 'rgba(160, 220, 205, 0.55)';
    ctx.fillText('BEST', W - 16, 16);
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#3ff5d0';
    ctx.fillText(String(best).padStart(2, '0'), W - 16, 33);
  }

  function drawFood() {
    const x = game.food.x * CELL + CELL / 2;
    const y = HUD + game.food.y * CELL + CELL / 2;
    const pulse = 1 + Math.sin(game.elapsed * 5) * 0.12;

    ctx.save();
    ctx.shadowColor = 'rgba(255, 94, 168, 0.8)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#ff5ea8';
    ctx.beginPath();
    ctx.arc(x, y, 6.5 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#ffd3e5';
    ctx.beginPath();
    ctx.arc(x - 2, y - 2, 2.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 94, 168, 0.35)';
    ctx.beginPath();
    ctx.arc(x, y, 11 + Math.sin(game.elapsed * 5) * 2, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawSnake() {
    const count = game.snake.length;
    for (let index = count - 1; index >= 0; index -= 1) {
      const segment = game.snake[index];
      const x = segment.x * CELL + 2;
      const y = HUD + segment.y * CELL + 2;
      const size = CELL - 4;
      const fade = 1 - index / (count + 8);
      const isHead = index === 0;

      ctx.save();
      if (isHead) {
        ctx.shadowColor = 'rgba(63, 245, 208, 0.9)';
        ctx.shadowBlur = 20;
      }
      const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
      gradient.addColorStop(0, isHead ? '#ddfff7' : 'rgba(63, 245, 208, ' + (0.28 + fade * 0.65) + ')');
      gradient.addColorStop(1, isHead ? '#3ff5d0' : 'rgba(20, 130, 112, ' + (0.22 + fade * 0.6) + ')');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(x, y, size, size, isHead ? 7 : 5);
      ctx.fill();
      if (isHead) {
        ctx.strokeStyle = 'rgba(220, 255, 248, 0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();

      if (isHead) {
        const eyeOffsets = game.direction.x !== 0
          ? [{ x: game.direction.x * 4, y: -4 }, { x: game.direction.x * 4, y: 4 }]
          : [{ x: -4, y: game.direction.y * 4 }, { x: 4, y: game.direction.y * 4 }];
        for (const offset of eyeOffsets) {
          ctx.fillStyle = '#04201a';
          ctx.beginPath();
          ctx.arc(x + size / 2 + offset.x, y + size / 2 + offset.y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawParticles() {
    for (const particle of game.particles) {
      ctx.globalAlpha = clamp(particle.life / particle.max, 0, 1);
      ctx.fillStyle = particle.color;
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawReady() {
    ctx.fillStyle = 'rgba(3, 10, 7, 0.66)';
    ctx.fillRect(0, HUD, W, ROWS * CELL);
    ctx.textAlign = 'center';
    ctx.font = '700 32px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ecfff9';
    ctx.fillText('VECTOR RUN', W / 2, HUD + 190);
    ctx.font = '500 10px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = 'rgba(63, 245, 208, 0.8)';
    ctx.fillText('SERPENT PROTOCOL // GRID 24×24', W / 2, HUD + 212);

    ctx.strokeStyle = 'rgba(63, 245, 208, 0.2)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - 126, HUD + 250, 252, 54, 12);
    ctx.stroke();

    const pulse = 0.55 + Math.sin(game.elapsed * 3) * 0.25;
    ctx.globalAlpha = pulse;
    ctx.font = '600 12px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = '#dffff7';
    ctx.fillText('PRESS AN ARROW TO BEGIN', W / 2, HUD + 281);
    ctx.globalAlpha = 1;
  }

  function drawPaused() {
    ctx.fillStyle = 'rgba(3, 10, 7, 0.7)';
    ctx.fillRect(0, HUD, W, ROWS * CELL);
    ctx.textAlign = 'center';
    ctx.font = '700 28px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#dffff7';
    ctx.fillText('PAUSED', W / 2, HUD + 230);
    ctx.font = '600 11px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = 'rgba(63, 245, 208, 0.8)';
    ctx.fillText('P TO RESUME', W / 2, HUD + 254);
  }

  function drawDead() {
    ctx.fillStyle = 'rgba(3, 8, 8, 0.76)';
    ctx.fillRect(0, HUD, W, ROWS * CELL);
    ctx.textAlign = 'center';
    ctx.font = '700 26px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ff8ab8';
    ctx.fillText('RUN TERMINATED', W / 2, HUD + 178);
    ctx.font = '500 10px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = 'rgba(180, 220, 215, 0.65)';
    ctx.fillText('VECTOR COLLISION DETECTED', W / 2, HUD + 198);

    ctx.font = '700 56px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ecfff9';
    ctx.fillText(String(game.score), W / 2, HUD + 262);
    ctx.font = '600 11px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = '#3ff5d0';
    ctx.fillText('BEST ' + best + '  ·  LENGTH ' + game.snake.length, W / 2, HUD + 286);

    const pulse = 0.55 + Math.sin(game.elapsed * 4) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.font = '600 12px "Cascadia Code", Consolas, monospace';
    ctx.fillStyle = '#dffff7';
    ctx.fillText('PRESS ANY ARROW TO RESTART', W / 2, HUD + 340);
    ctx.globalAlpha = 1;
  }

  function frame(timestamp) {
    const dt = Math.min(0.033, (timestamp - (frame.last || timestamp)) / 1000 || 0.016);
    frame.last = timestamp;
    update(dt);

    ctx.save();
    if (game.shake > 0) {
      ctx.translate((Math.random() - 0.5) * game.shake * 8, (Math.random() - 0.5) * game.shake * 8);
    }
    drawBoard();
    drawFood();
    drawSnake();
    drawParticles();
    drawHud();
    if (game.mode === 'ready') drawReady();
    if (game.mode === 'paused') drawPaused();
    if (game.mode === 'dead') drawDead();
    if (game.flash > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + game.flash * 0.28 + ')';
      ctx.fillRect(0, HUD, W, ROWS * CELL);
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }

  function restartOrStart() {
    if (game.mode === 'dead' || game.mode === 'ready') {
      reset();
      game.mode = 'playing';
      beep(240, 0.08, 'square', 0.02);
    }
  }

  function handleDirection(x, y) {
    if (game.mode === 'dead' || game.mode === 'ready') {
      restartOrStart();
      game.queued.push({ x, y });
      return;
    }
    turn(x, y);
  }

  const keyMap = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0]
  };

  window.addEventListener('keydown', (event) => {
    const direction = keyMap[event.code];
    if (direction) {
      event.preventDefault();
      handleDirection(direction[0], direction[1]);
      return;
    }
    if (event.code === 'KeyP' || event.code === 'Space') {
      event.preventDefault();
      if (game.mode === 'playing') game.mode = 'paused';
      else if (game.mode === 'paused') game.mode = 'playing';
      else restartOrStart();
      return;
    }
    if (event.code === 'KeyM') {
      muted = !muted;
      soundButton.textContent = muted ? 'sound off' : 'sound on';
    }
    if (event.code === 'KeyR') restartOrStart();
  });

  let touchStart = null;
  canvas.addEventListener('pointerdown', (event) => {
    touchStart = { x: event.clientX, y: event.clientY };
    if (game.mode === 'ready') restartOrStart();
  });
  canvas.addEventListener('pointerup', (event) => {
    if (!touchStart) return;
    const dx = event.clientX - touchStart.x;
    const dy = event.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) handleDirection(dx > 0 ? 1 : -1, 0);
    else handleDirection(0, dy > 0 ? 1 : -1);
  });
  canvas.addEventListener('contextmenu', (event) => event.preventDefault());

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
