[package]
name = "friday-intelligence"
version = "0.2.0"
description = "FRIDAY Intelligence desktop assistant"
authors = ["FRIDAY Intelligence"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-tts = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
enigo = "0.6"
robius-speech = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
base64 = "0.22"
zip = "0.6"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "time"] }
msedge-tts = { version = "0.4", features = ["blocking", "rustls"] }
